; ================= ESP32-S3 鼠标工程（阶段 1） =================
; 首次 build 会自动下载 ESP-IDF 工具链（约 1~2GB，耗时较长属正常）

[env:esp32s3]
; 固定官方平台来源和版本，避免被本机其他项目的pioarduino平台替换。
; 该平台使用ESP-IDF 6.0.1，与此前鼠标固件的构建环境一致。
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; 2026-10-25重新实测：MAC 28:84:85:60:da:8c，JEDEC 68/4018，物理16MB。
; 之前2MB是工程配置限制，并非本板容量；OTA两槽各2MiB。
board_upload.flash_size = 16MB
board_build.partitions = partitions_ota.csv
board_build.embed_txtfiles = .ota/ca.pem
